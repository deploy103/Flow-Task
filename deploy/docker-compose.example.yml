services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    environment:
      DATABASE_URL: ${DATABASE_URL}
      LOCAL_STORAGE_ROOT: /app/data/uploads
      SUBMISSION_CLEANUP_SECRET: ${SUBMISSION_CLEANUP_SECRET}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      INVITATION_CODE_PEPPER: ${INVITATION_CODE_PEPPER}
      CHALLENGE_FLAG_PEPPER: ${CHALLENGE_FLAG_PEPPER}
      INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY}
      EXTERNAL_SERVICE_ALLOWED_HOSTS: ${EXTERNAL_SERVICE_ALLOWED_HOSTS}
      NOTIFICATION_DELIVERY_SECRET: ${NOTIFICATION_DELIVERY_SECRET}
      WEB_PUSH_VAPID_PUBLIC_KEY: ${WEB_PUSH_VAPID_PUBLIC_KEY}
      WEB_PUSH_VAPID_PRIVATE_KEY: ${WEB_PUSH_VAPID_PRIVATE_KEY}
      WEB_PUSH_SUBJECT: ${WEB_PUSH_SUBJECT}
      INSTANCE_PROVIDER_URL: ${INSTANCE_PROVIDER_URL}
      INSTANCE_PROVIDER_TOKEN: ${INSTANCE_PROVIDER_TOKEN}
      AUTH_TRUST_PROXY: ${AUTH_TRUST_PROXY:-false}
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    volumes:
      - local_storage:/app/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app_network

  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: builder
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    command: ["sh", "-c", "node deploy/scripts/preflight-local-auth.mjs && npx prisma migrate deploy"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks:
      - app_network

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app_network

volumes:
  postgres_data:
  local_storage:

networks:
  app_network:
    driver: bridge
