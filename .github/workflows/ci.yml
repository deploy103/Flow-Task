name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: ["feature/**", "fix/**", "refactor/**", "hotfix/**"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://localhost:5432/flow_task
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-public-placeholder
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-placeholder-value-32-characters
      SUBMISSION_STORAGE_BUCKET: assignment-submissions
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      INVITATION_CODE_PEPPER: ci-only-placeholder-value-32-characters
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma Client
        run: npm run prisma:generate
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Cleanup workflow script tests
        run: sh deploy/scripts/test-submission-cleanup.sh
      - name: Production build
        run: npm run build
      - name: Dependency audit
        run: npm audit --audit-level=moderate

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan committed content
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
