name: Notification delivery

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DELIVERY_URL: ${{ secrets.NOTIFICATION_DELIVERY_URL }}
      DELIVERY_SECRET: ${{ secrets.NOTIFICATION_DELIVERY_SECRET }}
    steps:
      - uses: actions/checkout@v7
      - name: Require delivery configuration
        run: |
          test -n "$DELIVERY_URL"
          test -n "$DELIVERY_SECRET"
      - name: Deliver queued notifications
        run: sh deploy/scripts/run-notification-delivery.sh
