name: Submission upload cleanup

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLEANUP_URL: ${{ secrets.SUBMISSION_CLEANUP_URL }}
      CLEANUP_SECRET: ${{ secrets.SUBMISSION_CLEANUP_SECRET }}
    steps:
      - name: Check cleanup configuration
        id: configuration
        run: |
          if [ -n "$CLEANUP_URL" ] && [ -n "$CLEANUP_SECRET" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif [ -z "$CLEANUP_URL" ] && [ -z "$CLEANUP_SECRET" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Submission upload cleanup is disabled because its secrets are not configured."
          else
            echo "::error::SUBMISSION_CLEANUP_URL and SUBMISSION_CLEANUP_SECRET must be configured together."
            exit 1
          fi
      - name: Checkout cleanup script
        if: steps.configuration.outputs.enabled == 'true'
        uses: actions/checkout@v7
      - name: Remove expired submission uploads
        if: steps.configuration.outputs.enabled == 'true'
        run: sh deploy/scripts/run-submission-cleanup.sh
